name: Build Windows & Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sauvegarder les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec.yaml pubspec_custom.yaml
          copy lib\main.dart main_custom.dart

      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=windows --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .

      - name: Restaurer les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec_custom.yaml pubspec.yaml
          copy main_custom.dart lib\main.dart
          del pubspec_custom.yaml
          del main_custom.dart

      - name: Appliquer l'icône Windows personnalisée
        shell: cmd
        run: copy assets\icon\app_icon.ico windows\runner\resources\app_icon.ico

      - name: Activer le mode développeur Windows
        shell: cmd
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - run: flutter pub get

      - run: flutter config --enable-windows-desktop

      - name: Compiler Windows
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-logs-windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # NOUVEAU : permet de télécharger l'application depuis GitHub Actions
      - name: Télécharger l'application Windows
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-emailing-pro-windows
          path: build/windows/x64/runner/Release/
          compression-level: 6

      - name: Enregistrer le log d'erreur dans le depot
        if: failure()
        shell: pwsh
        run: |
          git config user.email "ci-bot@local"
          git config user.name "CI Bot"
          git add build-logs-windows.txt -f
          git commit -m "Log erreur build Windows"
          git push origin HEAD:main

      - name: Deposer le build Windows dans le depot (le nouveau fichier gagne toujours)
        if: success()
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'

          New-Item -ItemType Directory -Force -Path builds | Out-Null

          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = Join-Path $env:RUNNER_TEMP "windows-latest.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          # Compress-Archive a des bugs connus (chemins longs, échecs silencieux)
          # sur certains contenus Flutter Windows : on utilise directement l'API
          # .NET, plus fiable pour ce cas, avec verification explicite ensuite.
          $zipError = $null
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::CreateFromDirectory($releaseDir, $zipPath)
          } catch {
            $zipError = $_.Exception.Message
          }

          $zipInfo = Get-Item $zipPath -ErrorAction SilentlyContinue
          $zipSizeOk = $zipInfo -and $zipInfo.Length -gt 1000000

          if (-not $zipSizeOk) {
            # Ne jamais committer/pousser silencieusement un zip absent ou
            # anormalement petit : on consigne le probleme dans le depot pour
            # qu'il soit visible, et on arrete l'etape en echec explicite.
            git config user.email "ci-bot@local"
            git config user.name "CI Bot"
            git fetch origin main
            git reset --hard origin/main
            New-Item -ItemType Directory -Force -Path builds | Out-Null
            $diag = "Echec de la compression du build Windows le " + (Get-Date -Format "o") + "`n"
            $diag += "Erreur : $zipError`n"
            $diag += "Taille du zip obtenu : " + $(if ($zipInfo) { $zipInfo.Length } else { "fichier absent" }) + "`n"
            $diag | Out-File builds/windows-compress-error.txt -Force
            git add builds/windows-compress-error.txt -f
            git commit -m "Echec compression Windows"
            git push origin HEAD:main
            Write-Host "::error::Compression du build Windows invalide (taille: $($zipInfo.Length))"
            exit 1
          }

          git config user.email "ci-bot@local"
          git config user.name "CI Bot"

          $SUCCESS = $false

          "" | Out-File win-deposit-log.txt

          for ($i=1; $i -le 5; $i++) {

            Add-Content win-deposit-log.txt "=== tentative $i ==="

            git fetch origin main *> fetch_out.txt
            Get-Content fetch_out.txt | Add-Content win-deposit-log.txt

            git reset --hard origin/main *> reset_out.txt
            Get-Content reset_out.txt | Add-Content win-deposit-log.txt

            New-Item -ItemType Directory -Force -Path builds | Out-Null

            Copy-Item $zipPath builds/windows-latest.zip -Force
            # Fichier compagnon dont le contenu change à chaque run : garantit
            # qu'il y a toujours quelque chose à committer, même si le zip lui-
            # même finissait par être identique au précédent (ce qui empêchait
            # silencieusement la mise à jour du build sans que rien ne l'indique).
            Get-Date -Format "o" | Out-File builds/windows-build-info.txt -Force
            Remove-Item builds/windows-compress-error.txt -Force -ErrorAction SilentlyContinue

            git add builds/windows-latest.zip builds/windows-build-info.txt -f
            git add builds/windows-compress-error.txt -f -A 2>$null

            git commit -m "Build Windows" *> commit_out.txt
            Get-Content commit_out.txt | Add-Content win-deposit-log.txt

            git push origin HEAD:main *> push_out.txt

            $pushExit = $LASTEXITCODE

            Get-Content push_out.txt | Add-Content win-deposit-log.txt

            Add-Content win-deposit-log.txt "push exit code: $pushExit"

            if ($pushExit -eq 0) {
              $SUCCESS = $true
              Add-Content win-deposit-log.txt "PUSH REUSSI"
              break
            }

            Add-Content win-deposit-log.txt "PUSH ECHOUE, nouvelle tentative"

            Start-Sleep -Seconds (Get-Random -Minimum 4 -Maximum 12)
          }

          Get-Content win-deposit-log.txt

          if (-not $SUCCESS) {
            git add win-deposit-log.txt -f
            git commit -m "Log erreur depot Windows"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            exit 1
          }


  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sauvegarder les fichiers personnalisés
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          cp lib/main.dart /tmp/main_custom.dart

      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=android --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .

      - name: Restaurer les fichiers personnalisés
        run: |
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/main_custom.dart lib/main.dart

      - run: flutter pub get

      - name: Forcer compileSdk 36 (app + plugin file_picker)
        run: |
          python3 - << 'PYEOF'
          import re
          import os
          import glob

          paths = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle"
          ]

          paths += glob.glob(
              os.path.expanduser(
                  "~/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*"
              )
          )

          for path in paths:
              if os.path.exists(path):
                  with open(path) as f:
                      content = f.read()

                  new_content = re.sub(
                      r'flutter\.compileSdkVersion',
                      '36',
                      content
                  )

                  new_content = re.sub(
                      r'compileSdkVersion\s+\d+',
                      'compileSdkVersion 36',
                      new_content
                  )

                  new_content = re.sub(
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 36',
                      new_content
                  )

                  new_content = re.sub(
                      r'compileSdk\s+\d+',
                      'compileSdk 36',
                      new_content
                  )

                  with open(path, 'w') as f:
                      f.write(new_content)

                  print(f"Modifie: {path}")
          PYEOF

      - name: Restaurer la clé de signature stable
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Générer l'icône de l'application
        run: dart run flutter_launcher_icons

      - name: Compiler Android
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-logs-android.txt

      # NOUVEAU : permet de télécharger l'APK depuis GitHub Actions
      - name: Télécharger l'APK Android
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-emailing-pro-android
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0

      - name: Enregistrer le log d'erreur dans le depot
        if: failure()
        run: |
          git config user.email "ci-bot@local"
          git config user.name "CI Bot"
          git add build-logs-android.txt -f
          git commit -m "Log erreur build Android"
          git push origin HEAD:main

      - name: Deposer l'APK Android dans le depot (le nouveau fichier gagne toujours)
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-release.apk

          git config user.email "ci-bot@local"
          git config user.name "CI Bot"

          SUCCESS=false

          for i in 1 2 3 4 5; do

            {
              echo "=== tentative $i ==="

              git fetch origin main

              git reset --hard origin/main

              mkdir -p builds

              cp /tmp/app-release.apk builds/android-latest.apk
              date -u +"%Y-%m-%dT%H:%M:%SZ" > builds/android-build-info.txt

              git add builds/android-latest.apk builds/android-build-info.txt -f

              git commit -m "Build Android" || echo "rien a committer"

              if git push origin HEAD:main; then
                echo "PUSH REUSSI"
              else
                echo "PUSH ECHOUE"
              fi

            } > git-deposit-log.txt 2>&1

            cat git-deposit-log.txt

            if grep -q "PUSH REUSSI" git-deposit-log.txt; then
              SUCCESS=true
              break
            fi

            sleep $((RANDOM % 8 + 4))
          done

          if [ "$SUCCESS" = false ]; then

            python3 - << 'PYEOF2'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          uri = f"https://api.github.com/repos/{repo}/contents/git-deposit-android-error.txt"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          with open("git-deposit-log.txt", "rb") as f:
              content_b64 = base64.b64encode(f.read()).decode()

          sha = None

          try:
              req = urllib.request.Request(uri, headers=headers)

              with urllib.request.urlopen(req) as resp:
                  sha = json.load(resp).get("sha")

          except Exception:
              pass

          body = {
              "message": "Log erreur depot Android git",
              "content": content_b64
          }

          if sha:
              body["sha"] = sha

          put_req = urllib.request.Request(
              uri,
              data=json.dumps(body).encode(),
              headers=headers,
              method="PUT"
          )

          with urllib.request.urlopen(put_req) as resp:
              print(resp.status)
          PYEOF2

            exit 1
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
