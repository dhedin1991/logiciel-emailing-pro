name: Build Windows & Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Sauvegarder les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec.yaml pubspec_custom.yaml
          copy lib\main.dart main_custom.dart
      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=windows --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .
      - name: Restaurer les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec_custom.yaml pubspec.yaml
          copy main_custom.dart lib\main.dart
          del pubspec_custom.yaml
          del main_custom.dart
      - name: Activer le mode développeur Windows
        shell: cmd
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Compiler Windows
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-logs-windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Enregistrer le log d'erreur dans le depot
        if: failure()
        shell: pwsh
        run: |
          git config user.email "ci-bot@local"
          git config user.name "CI Bot"
          git add build-logs-windows.txt -f
          git commit -m "Log erreur build Windows"
          git push origin HEAD:main

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Sauvegarder les fichiers personnalisés
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          cp lib/main.dart /tmp/main_custom.dart
      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=android --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .
      - name: Restaurer les fichiers personnalisés
        run: |
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/main_custom.dart lib/main.dart
      - run: flutter pub get
      - name: Restaurer la clé de signature stable
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Compiler Android
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-logs-android.txt
      - name: Enregistrer le log d'erreur dans le depot
        if: failure()
        run: |
          git config user.email "ci-bot@local"
          git config user.name "CI Bot"
          git add build-logs-android.txt -f
          git commit -m "Log erreur build Android"
          git push origin HEAD:main
