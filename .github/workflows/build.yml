name: Build Windows & Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Sauvegarder les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec.yaml pubspec_custom.yaml
          copy lib\main.dart main_custom.dart
      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=windows --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .
      - name: Restaurer les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec_custom.yaml pubspec.yaml
          copy main_custom.dart lib\main.dart
          del pubspec_custom.yaml
          del main_custom.dart
      - name: Appliquer l'icône Windows personnalisée
        shell: cmd
        run: copy assets\icon\app_icon.ico windows\runner\resources\app_icon.ico
      - name: Activer le mode développeur Windows
        shell: cmd
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Compiler Windows
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-logs-windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Enregistrer le log d'erreur dans le depot
        if: failure()
        shell: pwsh
        run: |
          git config user.email "ci-bot@local"
          git config user.name "CI Bot"
          git add build-logs-windows.txt -f
          git commit -m "Log erreur build Windows"
          git push origin HEAD:main
      - name: Deposer le build Windows dans le depot (API, sans conflit)
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path builds | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath builds/windows-latest.zip -Force
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("builds/windows-latest.zip"))
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $repo = "$env:GITHUB_REPOSITORY"
          $uri = "https://api.github.com/repos/$repo/contents/builds/windows-latest.zip"
          $sha = $null
          try { $existing = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get; $sha = $existing.sha } catch {}
          $body = @{ message = "Build Windows"; content = $content }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Uri $uri -Headers $headers -Method Put -Body ($body | ConvertTo-Json) -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Sauvegarder les fichiers personnalisés
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          cp lib/main.dart /tmp/main_custom.dart
      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=android --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .
      - name: Restaurer les fichiers personnalisés
        run: |
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/main_custom.dart lib/main.dart
      - run: flutter pub get
      - name: Forcer compileSdk 36 (app + plugin file_picker)
        run: |
          python3 - << 'PYEOF'
          import re, os, glob
          paths = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          paths += glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*"))
          for path in paths:
              if os.path.exists(path):
                  with open(path) as f:
                      content = f.read()
                  new_content = re.sub(r'flutter\.compileSdkVersion', '36', content)
                  new_content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', new_content)
                  new_content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', new_content)
                  new_content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', new_content)
                  with open(path, 'w') as f:
                      f.write(new_content)
                  print(f"Modifie: {path}")
          PYEOF
      - name: Restaurer la clé de signature stable
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Générer l'icône de l'application
        run: dart run flutter_launcher_icons
      - name: Compiler Android
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-logs-android.txt
      - name: Enregistrer le log d'erreur dans le depot
        if: failure()
        run: |
          git config user.email "ci-bot@local"
          git config user.name "CI Bot"
          git add build-logs-android.txt -f
          git commit -m "Log erreur build Android"
          git push origin HEAD:main
      - name: Deposer l'APK Android dans le depot (API, sans conflit)
        if: success()
        run: |
          mkdir -p builds
          cp build/app/outputs/flutter-apk/app-release.apk builds/android-latest.apk
          CONTENT=$(base64 -w0 builds/android-latest.apk)
          URI="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/builds/android-latest.apk"
          SHA=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$URI" | python3 -c "import json,sys
try:
    print(json.load(sys.stdin)['sha'])
except Exception:
    print('')")
          if [ -n "$SHA" ]; then
            BODY=$(python3 -c "import json; print(json.dumps({'message':'Build Android','content':open('/dev/stdin').read().strip(),'sha':'$SHA'}))" <<< "$CONTENT")
          else
            BODY=$(python3 -c "import json; print(json.dumps({'message':'Build Android','content':open('/dev/stdin').read().strip()}))" <<< "$CONTENT")
          fi
          curl -s -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$URI" -d "$BODY" -o /dev/null -w "HTTP %{http_code}\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

