name: Build Windows & Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Créer la release "latest" si elle n'existe pas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create latest --repo "$GITHUB_REPOSITORY" \
            --title "Derniers builds" \
            --notes "Builds automatiques Windows et Android (remplacés à chaque compilation)." \
            --prerelease

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sauvegarder les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec.yaml pubspec_custom.yaml
          copy lib\main.dart main_custom.dart

      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=windows --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .

      - name: Restaurer les fichiers personnalisés
        shell: cmd
        run: |
          copy pubspec_custom.yaml pubspec.yaml
          copy main_custom.dart lib\main.dart
          del pubspec_custom.yaml
          del main_custom.dart

      - name: Appliquer l'icône Windows personnalisée
        shell: cmd
        run: copy assets\icon\app_icon.ico windows\runner\resources\app_icon.ico

      - name: Activer le mode développeur Windows
        shell: cmd
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - run: flutter pub get

      - run: flutter config --enable-windows-desktop

      - name: Compiler Windows
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          flutter build windows --release --build-number=${{ github.run_number }} 2>&1 | Tee-Object -FilePath build-logs-windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # NOUVEAU : permet de télécharger l'application depuis GitHub Actions
      - name: Télécharger l'application Windows
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-emailing-pro-windows
          path: build/windows/x64/runner/Release/
          compression-level: 6

      - name: Conserver le log de build en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: build-logs-windows.txt

      - name: Publier le build Windows dans la release "latest"
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "windows-latest.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("build/windows/x64/runner/Release", $zip)
          $size = (Get-Item $zip).Length
          if ($size -lt 1000000) { Write-Host "::error::Zip Windows invalide ($size octets)"; exit 1 }
          gh release upload latest $zip --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }


  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sauvegarder les fichiers personnalisés
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          cp lib/main.dart /tmp/main_custom.dart

      - name: Générer les dossiers de plateforme manquants
        run: flutter create --platforms=android --project-name logiciel_emailing_pro --org com.dhedin1991.emailingpro .

      - name: Restaurer les fichiers personnalisés
        run: |
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/main_custom.dart lib/main.dart

      - run: flutter pub get

      - name: Autoriser Internet et configurer le manifeste Android
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              m = f.read()
          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "android:usesCleartextTraffic" not in m:
              m = m.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if "android:allowBackup" not in m:
              m = m.replace("<application", '<application android:allowBackup="false"', 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(m)
          print(m)
          PYEOF

      - name: Forcer compileSdk 36 (app + plugin file_picker)
        run: |
          python3 - << 'PYEOF'
          import re
          import os
          import glob

          paths = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle"
          ]

          paths += glob.glob(
              os.path.expanduser(
                  "~/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*"
              )
          )

          for path in paths:
              if os.path.exists(path):
                  with open(path) as f:
                      content = f.read()

                  new_content = re.sub(
                      r'flutter\.compileSdkVersion',
                      '36',
                      content
                  )

                  new_content = re.sub(
                      r'compileSdkVersion\s+\d+',
                      'compileSdkVersion 36',
                      new_content
                  )

                  new_content = re.sub(
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 36',
                      new_content
                  )

                  new_content = re.sub(
                      r'compileSdk\s+\d+',
                      'compileSdk 36',
                      new_content
                  )

                  with open(path, 'w') as f:
                      f.write(new_content)

                  print(f"Modifie: {path}")
          PYEOF

      - name: Restaurer la clé de signature stable
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Générer l'icône de l'application
        run: dart run flutter_launcher_icons

      - name: Compiler Android
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build-logs-android.txt

      # NOUVEAU : permet de télécharger l'APK depuis GitHub Actions
      - name: Télécharger l'APK Android
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-emailing-pro-android
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0

      - name: Conserver le log de build en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-android
          path: build-logs-android.txt

      - name: Publier le log d'échec dans la release (lisible sans télécharger d'artefact)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -n -i -B1 -A3 "error" build-logs-android.txt | head -150 > /tmp/erreurs-android.txt || true
          [ -s /tmp/erreurs-android.txt ] || tail -80 build-logs-android.txt > /tmp/erreurs-android.txt
          gh release upload latest /tmp/erreurs-android.txt --clobber --repo "$GITHUB_REPOSITORY" || true

      - name: Publier l'APK dans la release "latest"
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/logiciel-emailing-pro-android.apk
          gh release upload latest /tmp/logiciel-emailing-pro-android.apk --clobber --repo "$GITHUB_REPOSITORY"
