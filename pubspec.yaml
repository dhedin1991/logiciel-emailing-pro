name: logiciel_emailing_pro
description: Logiciel professionnel d'envoi d'e-mails multi-comptes
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.2.6
  crypto: ^3.0.3
  file_picker: ^10.3.7
  csv: ^6.0.0
  excel: ^4.0.6
  uuid: ^4.4.0
  mailer: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
